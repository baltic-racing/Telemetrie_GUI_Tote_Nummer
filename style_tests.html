    <style>

        .data_box {
            background-color: rgb(36, 31, 103);

            text-align: center;

            padding-top: 10px;
            padding-bottom: 0px;
            padding-left: 0px;

            filter: drop-shadow(5px 5px 2px rgba(00, 00, 00, 0.35));

    </style>
</head>

<body>                                                                      <!--Sichtbarer Teil der Webseite-->
    <div id="header" class="container">
        <h1>BRT - Telemetrie TY25</h1>
        <div id="clock"></div>
    </div>

    <div id="statusline" class="container">
        <p>
            <h3>Verbindungsstatus:</h3>
            <b id="Connection_status"></b>
        </p>
    </div>

    <div id="telemetrie" class="container">
        <h2>Telemetrie</h2>
    </div>

    <div id="tech_data" class="container">
        <h2>Technische Daten</h2>
        <p> TSAC-Zellen: Sony VTC6</p>
        <p> Stackanzahl: 12</p>
        <p> Stackzellenanzahl: 11</p>
        <p> Zellen pro Stackzelle: 5</p>
    </div>
</body>

<script>                                                                    /*Logischer Teil der Webseite - Berchnungen und weiteres*/
    
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('de-DE', { hour12: false });
      const ms = now.getMilliseconds().toString().padStart(3, '0');
      document.getElementById("clock").textContent = `${time}.${ms}`;
    }

    // alle 1 ms aktualisieren
    setInterval(updateClock, 1);
    
    
    
    let main_container = document.getElementById("telemetrie");

    function create_data_box(telemetry_name, count = 2){
            for (let i = 0; i < count; i++){
                let box = document.createElement("div");
                box.className = "data_box";
                box.id = `data_box_${telemetry_name}_${i}`;

                if(i == 1){
                    box.innerHTML = `<pre id="output">Lade Daten...</pre>`;
                }else{
                    box.innerHTML = `${telemetry_name}:`;
                }

            main_container.appendChild(box); // WICHTIG: füge die Box ins DOM ein
        }
    }

    function update_UI(data) {
        for (const key in data) {
            const value = data[key];

            // Wenn Box noch nicht existiert → erstellen
            if (!boxes[key]) {
                const box = document.createElement("div");
                box.className = "data_box";
                box.innerHTML = `<div>${key}</div><span class="value" id="val-${key}">${value.toFixed(2)}</span>`;
                telemetryContainer.appendChild(box);
                boxes[key] = document.getElementById(`val-${key}`);
            } else {
                // Wenn Box existiert → Wert animiert aktualisieren
                const span = boxes[key];
                if (span.textContent !== value.toFixed(2)) {
                    span.textContent = value.toFixed(2);
                    span.classList.add("updated");
                    setTimeout(() => span.classList.remove("updated"), 500);
                }
            }
        }
    }

    //Kommunikation mit dem Server/App - Daten welche über das Funkmodul kommen
    async function fetch_data() {
                    const r = await fetch('/data');
                    const data = await r.json();
                    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                    update_UI(data);
                }
    setInterval(fetch_data, 100);                                             //ruft alle 100 ms daten vom Senic-Server (Python) ab
    fetch_data();                                                             //ruft einmalig sofort auf, damit die Daten sofort dargestellt werden

</script>

</html>
